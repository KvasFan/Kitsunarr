[package]
name = "kitsunarr-web"
description = "Kitsunarr browser interface (Dioxus, compiled to WebAssembly)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
kitsunarr-domain = { workspace = true }
kitsunarr-client = { workspace = true }
dioxus = { workspace = true, features = ["web", "router", "lib", "launch", "logger"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }
futures = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob", "CssStyleDeclaration", "Document", "Element", "EventSource", "EventTarget", "File", "Headers", "HtmlElement",
    "HtmlInputElement", "KeyboardEvent", "Location", "MediaQueryList", "MessageEvent", "Navigator", "Clipboard",
    "Request", "RequestCredentials", "RequestInit", "Response", "Storage", "Window",
    "MutationObserver", "MutationObserverInit", "MutationRecord", "Node", "NodeList",
] }

[lints]
workspace = true
