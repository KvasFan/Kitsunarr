name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kitsunarr version
      description: System → Status & health shows it.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker image, Native binary, Built from source]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: System → Logs or container logs. Remove API keys and passwords.
      render: text
