name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  binary:
    name: Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Install dx
        run: |
          curl -fsSL -o dx.tar.gz "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf dx.tar.gz -C "$HOME/.local/bin" dx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: dx build -p kitsunarr-web --release --profile web-release
      - run: cargo build --release --locked -p kitsunarr-server
        env:
          KITSUNARR_GIT_REVISION: ${{ github.sha }}
      - name: Package
        run: |
          name="kitsunarr-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp target/release/kitsunarr LICENSE COPYRIGHT.md README.md deployment/kitsunarr.service "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            kitsunarr-*.tar.gz
            kitsunarr-*.tar.gz.sha256
          generate_release_notes: true

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kvasfan/kitsunarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: KITSUNARR_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
