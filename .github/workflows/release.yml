name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  binary:
    name: Linux binary (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      - name: Install dx
        run: |
          curl -fsSL -o dx.tar.gz "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf dx.tar.gz -C "$HOME/.local/bin" dx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: dx build -p kitsunarr-web --release --profile web-release
      - run: cargo build --release --locked -p kitsunarr-server --target ${{ matrix.target }}
        env:
          KITSUNARR_GIT_REVISION: ${{ github.sha }}
      - name: Package
        run: |
          name="kitsunarr-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/kitsunarr LICENSE COPYRIGHT.md README.md deployment/kitsunarr.service "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            kitsunarr-*.tar.gz
            kitsunarr-*.tar.gz.sha256
          generate_release_notes: true

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The arm64 image's runtime stage (package installation) runs under QEMU; the server is
      # cross-compiled natively (see deployment/Dockerfile).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kvasfan/kitsunarr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: KITSUNARR_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
