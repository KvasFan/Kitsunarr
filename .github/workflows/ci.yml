name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  rust:
    name: Format, lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p kitsunarr-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  web:
    name: WebAssembly UI and browser end-to-end test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install dx ${{ env.DX_VERSION }}
        run: |
          curl -fsSL -o dx.tar.gz "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf dx.tar.gz -C "$HOME/.local/bin" dx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web UI
        run: dx build -p kitsunarr-web --release --profile web-release
      - name: Bundle size
        run: |
          {
            echo "### WebAssembly bundle"
            echo "| file | bytes | gzip -9 |"
            echo "|---|---:|---:|"
            for f in target/dx/kitsunarr-web/release/web/public/assets/*; do
              echo "| $(basename "$f") | $(stat -c %s "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the server (embeds the UI)
        run: cargo build -p kitsunarr-server
      - name: Browser end-to-end test (headless Chrome)
        run: cargo test -p kitsunarr-e2e -- --ignored --nocapture
        env:
          CHROMEDRIVER: ${{ env.CHROMEWEBDRIVER }}/chromedriver
          KITSUNARR_E2E_SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile
          load: true
          tags: kitsunarr:ci
          build-args: KITSUNARR_GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and probe the container
        run: |
          docker run -d --name kitsunarr -p 8990:8990 kitsunarr:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8990/api/v1/ping && break; sleep 1; done
          curl -fsS http://127.0.0.1:8990/api/v1/auth/status | grep -q '"setupRequired":true'
          curl -fsS http://127.0.0.1:8990/ | grep -q 'kitsunarr-url-base'
          docker exec kitsunarr /usr/local/bin/kitsunarr healthcheck
          docker exec kitsunarr /usr/local/bin/kitsunarr --version
          docker stop -t 30 kitsunarr
          docker logs kitsunarr 2>&1 | grep -q 'Kitsunarr stopped'
